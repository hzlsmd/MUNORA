name: munora
description: MUNORA weather app for Metro Manila (NCR), Philippines.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^9.0.0
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
