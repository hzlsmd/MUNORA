name: munora
description: MUNORA weather app for Metro Manila (NCR), Philippines.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^9.0.0
  material_ui: ^1.11.0
  http: ^1.6.0
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.3
  flutter_local_notifications: ^19.5.0
  workmanager: ^0.10.10
  flutter_svg: ^2.3.2
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  firebase_core_platform_interface: ^8.1.1

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/design/
    - assets/models/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter.ttf
    - family: Abyssinica
      fonts:
        - asset: assets/fonts/abyssinica/AbyssinicaSIL-Regular.ttf
